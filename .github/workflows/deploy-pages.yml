name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NITRO_PRESET: node-server
          NITRO_APP_BASE_URL: /
          VITE_CONTACT_API_URL: ${{ vars.CONTACT_API_URL }}

      - name: Render the home page and CV
        shell: bash
        run: |
          PORT=4173 node .output/server/index.mjs &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > .output/public/index.html; then
              break
            fi
            sleep 1
          done
          test -s .output/public/index.html
          mkdir -p .output/public/cv
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/cv > .output/public/cv/index.html; then
              break
            fi
            sleep 1
          done
          test -s .output/public/cv/index.html
          touch .output/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

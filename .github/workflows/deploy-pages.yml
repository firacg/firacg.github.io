name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NITRO_PRESET: node-server
          NITRO_APP_BASE_URL: /github-merge-clean/

      - name: Render the home page
        shell: bash
        run: |
          PORT=4173 node .output/server/index.mjs &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/github-merge-clean/ > .output/public/index.html; then
              break
            fi
            sleep 1
          done
          test -s .output/public/index.html
          sed -i 's|/portfolio/|/github-merge-clean/portfolio/|g; s|/downloads/|/github-merge-clean/downloads/|g; s|/favicon.ico|/github-merge-clean/favicon.ico|g' .output/public/index.html .output/public/assets/*.js
          touch .output/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

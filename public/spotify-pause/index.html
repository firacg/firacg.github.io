<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="description" content="Пауза: рекламный концепт Spotify. Ролик, визуальная разработка и процесс производства."><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пауза — Spotify / тестовое</title><style>*{box-sizing:border-box}body{margin:0;background:#101b14;font-family:Arial;color:#f4efe5}.slide{display:none;position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);margin:auto;background:#19251e}.slide.active{display:block}.page{width:100%;height:100%;object-fit:contain}h1{position:absolute;left:4.7%;top:3%;font-size:clamp(20px,3.4vw,44px);margin:0}video{position:absolute;left:8%;top:16%;width:84%;height:71%;object-fit:contain;background:#000}.spec{position:absolute;left:4.7%;bottom:2%;font-size:clamp(12px,1.8vw,23px)}nav{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:7px 14px;background:#17251ee6;border-radius:30px;font-size:13px}button{border:0;background:none;color:#f4efe5;cursor:pointer;font-size:18px}body{display:flex;align-items:center;min-height:100vh}nav button:focus{outline:2px solid #1ed760}@media print{body{display:block}.slide{display:block;width:100%;height:auto;aspect-ratio:16/9;break-after:page}nav{display:none}}.player{position:absolute;left:8%;top:87%;width:84%;display:flex;align-items:center;gap:12px;background:#19251e;font-size:13px;padding:5px}#seek{flex:1;accent-color:#1ed760;min-width:30px}#time{white-space:nowrap}video{height:69%;top:16%}</style><section class="slide"><img class="page" alt="Слайд 1" src="visual-0.png"></section><section class="slide"><h1>Готовый ролик</h1><video id="film" controlsList="nodownload noremoteplayback" disablePictureInPicture playsinline preload="metadata" poster="visual-1.jpg" src="film.mp4"></video><div class="player"><button id="play" aria-label="Воспроизвести видео">▶</button><input id="seek" type="range" min="0" max="100" value="0" aria-label="Позиция видео"><span id="time">0:00 / 0:29</span><button id="mute" aria-label="Звук">Звук</button><button id="vfull" aria-label="Видео на весь экран">⛶</button></div><p class="spec">29,14 с &nbsp; 2560 × 1440 &nbsp; 30 fps</p></section><section class="slide"><img class="page" alt="Слайд 3" src="visual-3.png"></section><section class="slide"><img class="page" alt="Слайд 4" src="visual-4.png"></section><section class="slide"><img class="page" alt="Слайд 5" src="visual-5.png"></section><section class="slide"><img class="page" alt="Слайд 6" src="visual-6.png"></section><section class="slide"><img class="page" alt="Слайд 7" src="visual-7.png"></section><nav aria-label="Навигация"><button onclick="go(-1)" aria-label="Предыдущий слайд">‹</button><span id="counter"></span><button onclick="go(1)" aria-label="Следующий слайд">›</button><button onclick="document.documentElement.requestFullscreen()" aria-label="Полный экран">⛶</button></nav><script>let n=0;const ss=[...document.querySelectorAll('.slide')];function show(){ss.forEach((s,i)=>s.classList.toggle('active',i===n));document.getElementById('counter').textContent=(n+1)+' / '+ss.length}function go(d){document.querySelector('video').pause();n=Math.max(0,Math.min(ss.length-1,n+d));show()}document.addEventListener('keydown',e=>{if(e.target.tagName==='VIDEO')return;if(e.key==='ArrowRight'||e.key==='PageDown')go(1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1)});show();const film=document.getElementById('film'),pb=document.getElementById('play'),seek=document.getElementById('seek');function toggle(){if(film.paused)film.play().catch(()=>{pb.textContent='Повторить'});else film.pause()}pb.onclick=toggle;film.onclick=toggle;film.addEventListener('contextmenu',e=>e.preventDefault());film.addEventListener('play',()=>pb.textContent='Ⅱ');film.addEventListener('pause',()=>pb.textContent='▶');film.addEventListener('timeupdate',()=>{seek.value=film.duration?film.currentTime/film.duration*100:0;document.getElementById('time').textContent='0:'+Math.floor(film.currentTime).toString().padStart(2,'0')+' / 0:29'});seek.oninput=()=>{if(film.duration)film.currentTime=seek.value/100*film.duration};document.getElementById('mute').onclick=()=>{film.muted=!film.muted;document.getElementById('mute').textContent=film.muted?'Без звука':'Звук'};document.getElementById('vfull').onclick=()=>film.requestFullscreen();document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'&&n===1){e.preventDefault();toggle()}});</script></html>
